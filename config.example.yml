app:
  environment: development
  data_dir: data
  host: 0.0.0.0
  port: 8080
  tenant_id: 00000000-0000-0000-0000-000000000001
  tenant_name: Default Tenant
  tenant_slug: default

ai:
  provider: openai_compatible
  base_url: https://api.example.com/v1
  model: your-model-name
  timeout_seconds: 30
  max_retries: 2

ci:
  connections:
    - id: corp-gitlab
      type: gitlab
      base_url: https://gitlab.example.com
      token_env: CORP_GITLAB_TOKEN
      webhook_secret_env: CORP_GITLAB_WEBHOOK_SECRET
    - id: build-jenkins
      type: jenkins
      base_url: https://jenkins.example.com
      username_env: JENKINS_USERNAME
      token_env: JENKINS_API_TOKEN
    - id: github-actions
      type: github
      base_url: https://api.github.com
      token_env: GITHUB_APP_TOKEN
      webhook_secret_env: GITHUB_WEBHOOK_SECRET

database:
  url: postgresql+asyncpg://ci_assistant:ci_assistant@postgres:5432/ci_assistant

redis:
  url: redis://redis:6379/0

knowledge:
  embedding_model: local-hashing-v1
  embedding_dimension: 384
  embedding_cache_enabled: true
  embedding_cache_path:
  embedding_cache_max_entries: 100000
  index_backend: faiss
  storage_path: data/knowledge
  context_max_chars: 6000
  unlimited_ocr:
    enabled: false
    base_url: http://unlimited-ocr:10000
    model: Unlimited-OCR
    timeout_seconds: 1200
    max_file_bytes: 20000000
    max_parsed_chars: 5000000
    max_pdf_pages: 40
    max_total_pixels: 100000000
    pdf_dpi: 150
  reranker:
    backend: disabled
    base_url: http://reranker:8080
    endpoint: /rerank
    model: BAAI/bge-reranker-v2-m3
    timeout_seconds: 15
    candidate_multiplier: 4
    device: cpu
    batch_size: 16
    max_length: 512
    revision:
    local_files_only: false
